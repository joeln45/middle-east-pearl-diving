<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="site-header"></div>

    <main class="contact-page">
      <div class="container">
        <h2 class="page-title">Let's Work Together</h2>
        <section class="contact-info">
          <div class="contact-form">
            <!--creating a contact form to collect the users feedback-->
            <h3>Questions? We'd love to hear from you!</h3>
            <form id="contactForm" action="#" method="post">
              <div class="form-group">
                <input type="text" name="name" placeholder="Name" required />
                <input type="email" name="email" placeholder="Email" required />
              </div>
              <textarea name="message" placeholder="Your Message" required></textarea>
              <button type="submit" class="btn">Send Message</button>
            </form>
            <p id="responseMessage" class="response-message">Your message has been sent!</p>
          </div>
        </section>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/components.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
