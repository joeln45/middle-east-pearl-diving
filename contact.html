<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">Contact Us</h1> <!--Creating the a header but putting the same css formating as the logo-->
            <button class="menu-toggle" aria-label="toggle navigation">
                <span class="menu-icon"><span>
            </button>
            <nav class="nav">
                <ul class="nav__list">  <!--Defining the nav buttons-->
                    <li><a href="index.html" class="nav__link">Home</a></li>
                    <li><a href="history-culture.html" class="nav__link">History & Culture</a></li>
                    <li><a href="techniques.html" class="nav__link">Modern Industry</a></li>
                    <li><a href="gallery.html" class="nav__link">Gallery</a></li>
                    <li><a href="contact.html" class="nav__link">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contact-page">
        <div class="container">
            <h2 class="page-title">Let's Work Together</h2>
            <section class="contact-info">
                <div class="contact-form">
                    <!--creating a contact form to collect the users feedback-->
                    <h3>Questions? We'd love to hear from you!</h3>
                    <form id="contactForm" action="#" method="post">
                        <div class="form-group">
                            <input type="text" name="name" placeholder="Name" required>
                            <input type="email" name="email" placeholder="Email" required>
                        </div>
                        <textarea name="message" placeholder="Your Message" required></textarea>
                        <button type="submit" class="btn">Send Message</button>
                    </form>
                    <p id="responseMessage" class="response-message">Your message has been sent!</p>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 Middle East Pearl Diving. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
