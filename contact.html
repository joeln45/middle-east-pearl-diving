<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="site-header"></div>

    <main id="main-content" tabindex="-1" class="contact-page">
      <div class="container">
        <h2 class="page-title">Let's Work Together</h2>
        <section class="contact-info">
          <div class="contact-form">
            <!--creating a contact form to collect the users feedback-->
            <h3>Questions? We'd love to hear from you!</h3>
            <!--
              TODO: replace YOUR_FORM_ID below with your real Formspree
              endpoint (formspree.io -> New form -> copy the /f/xxxxxx id).
              Client-side validation works without it; sending needs it.
            -->
            <form id="contactForm" action="https://formspree.io/f/xwvjqjyy" method="post">
              <div class="form-group">
                <div class="field">
                  <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Name"
                    aria-label="Your name"
                    autocomplete="name"
                    aria-describedby="name-error"
                    required
                  />
                  <span class="field-error" id="name-error"></span>
                </div>
                <div class="field">
                  <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email"
                    aria-label="Your email address"
                    autocomplete="email"
                    aria-describedby="email-error"
                    required
                  />
                  <span class="field-error" id="email-error"></span>
                </div>
              </div>
              <div class="field">
                <textarea
                  id="message"
                  name="message"
                  placeholder="Your Message"
                  aria-label="Your message"
                  aria-describedby="message-error"
                  required
                ></textarea>
                <span class="field-error" id="message-error"></span>
              </div>
              <!-- Subject line for the email Formspree forwards to you -->
              <input type="hidden" name="_subject" value="New enquiry from the Pearl Diving site" />
              <!-- Honeypot: hidden from people; bots that fill it are rejected -->
              <input
                type="text"
                name="_gotcha"
                tabindex="-1"
                autocomplete="off"
                aria-hidden="true"
                style="display: none"
              />
              <button type="submit" class="btn">Send Message</button>
            </form>
            <p id="responseMessage" class="response-message" role="status" aria-live="polite"></p>
          </div>
        </section>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/components.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
